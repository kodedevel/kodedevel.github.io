---
layout: category
---

<article>
  <section>
    <h2>فهرست مطالب</h2>
    <p>در این صفحه یک فهرست از مطالب لینوکس قرار دادیم، از اینجا میتونید به مطلب مورد نظر مراجعه کنید.</p>

    <div class="subject-container">
      {% for metadata in site.data.json.posts.linux.metadata_list %}
      <section class="card-view">
        <h3>
          {{ metadata.title }}
        </h3>
        <div>
          <figure>
            <img src="{{ metadata.imgCover }}" alt="{{ metadata_title }}">
          </figure>
          <p>{{ metadata.description }}</p>
          <a href="{{ metadata.link }}">مطالعه</a>
        </div>
      </section>
      {% endfor %}
    </div>

  </section>
</article>
