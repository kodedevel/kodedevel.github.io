---
layout: course
---

<article class="page-content">
  <section>
    <h2>فهرست مطالب</h2>

    <p>در اینجا یک فهرست از مطالب جاوا قرار دادیم، از اینجا میتونید به مطلب مورد نظر مراجعه کنید.</p>

    <ul class="card-view-container">

      {% for metadata in site.data.json.posts.java.metadata_list %}
      <li class="card-view-item">
        <a class="card-view" href="{{ metadata.link }}">
          <div class="card-view-header">
            <figure>
              <img src="{{ metadata.imgCover }}" alt="{{ metadata.title }}">
            </figure>
            <h3>
              {{ metadata.title }}
            </h3>
          </div>
          <div class="card-view-body">
            <p>{{ metadata.description }}</p>
          </div>
          <div class="card-view-footer">
            <span class="read-more">
              مطالعه
            </span>
          </div>
        </a>
      </li>
      {% endfor %}
    </ul>

  </section>
</article>
