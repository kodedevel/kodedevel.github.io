---
layout: category
---

<article>
  <section>
    <h2>فهرست مطالب</h2>

    <p>در یک فهرست از مطالب جاوا قرار دادیم، از اینجا میتونید به مطلب مورد نظر مراجعه کنید.</p>

    <div class="card-view-container">

      {% for metadata in site.data.json.posts.java.metadata_list %}
      <section class="card-view">
        <h3>
          {{ metadata.title }}
        </h3>
        <div>
          <figure>
            <img src="{{ metadata.imgCover }}" alt="{{ metadata.title }}">
          </figure>
          <p>{{ metadata.description }}</p>
          <a href="{{ metadata.link }}">مطالعه</a>
        </div>
      </section>
      {% endfor %}
    </div>

  </section>
</article>
