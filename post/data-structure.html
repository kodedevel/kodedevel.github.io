---
layout: category
---


<article>
  <section>

    <h2>فهرست مطالب</h2>

    <p>در اینجا یک فهرست از مطالب ساختار داده ها قرار دادیم، از این صفحه میتونید به مطلب مورد نظر خودتون مراجعه کنید..
    </p>

    <div class="card-view-container">
      {% for metadata in site.data.json.posts.data-structure.metadata_list %}
      <section class="card-view">
        <h3>
          {{ metadata.title }}
        </h3>
        <div>
          <figure>
            <img src="{{ metadata.imgCover }}" alt="{{ metadata_title }}">
          </figure>
          <p>{{ metadata.description }}</p>
          <a href="{{ metadata.link }}">مطالعه</a>
        </div>
      </section>
      {% endfor %}
    </div>

  </section>
</article>
