<div class="article-foot">

  {% include comments.html %}
  <aside>
    <nav class="post-navigation-container" style="justify-content: end;">
      <a class="md-bt md-bt-light bt-back-home" href="/">
        <span>صفحه اصلی</span>
        <span class="material-symbols-outlined">
          home
        </span>
      </a>
    </nav>
    <section>

      <h2>موضوعات دیگر</h2>

      <ul>
        {% for metadata in site.data.json.categories.metadata_list %}
        {% if page.url != metadata.link %}
        <li><a href="{{ metadata.link }}">{{ metadata.title }}</a></li>
        {% endif %}
        {% endfor %}
      </ul>

    </section>
  </aside>
</div>
